services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: find
      POSTGRES_PASSWORD: find
      POSTGRES_DB: find
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - find-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U find -d find"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  find-pg:
